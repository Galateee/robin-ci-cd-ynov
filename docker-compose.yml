services:
  db:
    build:
      context: ./app
      dockerfile: server/Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ynov_ci}
      MYSQL_USER: ${MYSQL_APP_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-apppass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./app
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ynov_ci}
      MYSQL_USER: ${MYSQL_APP_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-apppass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_APP_PASSWORD:-apppass}
    volumes:
      - ./app/server:/server
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/users')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_HOST: localhost
      VITE_API_PORT: ${API_PORT:-8000}
    volumes:
      - ./app:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      api:
        condition: service_healthy
