name: Fullstack CI/CD

on:
  push:
    branches: [master]

jobs:
  fullstack-e2e:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ynov_ci
      MYSQL_APP_USER: appuser
      MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      API_PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install frontend dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Run unit tests
        run: cd app && pnpm test

      - name: Build and start full stack
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up --detach

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/users > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 4
          done
          echo "API did not become ready in time"
          docker compose logs api
          exit 1

      - name: Run Cypress E2E on real environment
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: app
          wait-on: "http://localhost:5173/,http://localhost:8000/users"
          command: pnpm cypress run --browser electron

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish-npm:
    needs: fullstack-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Build package
        run: cd app && pnpm run build-npm

      - name: Check version and decide publish
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./app/package.json').version")
          PUBLISHED_VERSION=$(npm show robin-ci-cd-ynov version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          IS_NEWER=$(node -e "
            const semver = (v) => v.split('.').map(Number);
            const [la, lb, lc] = semver('$LOCAL_VERSION');
            const [pa, pb, pc] = semver('$PUBLISHED_VERSION');
            const newer = la > pa || (la === pa && lb > pb) || (la === pa && lb === pb && lc > pc);
            console.log(newer ? 'true' : 'false');
          ")
          echo "should_publish=$IS_NEWER" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        if: steps.version-check.outputs.should_publish == 'true'
        run: cd app && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.version-check.outputs.should_publish == 'false'
        run: echo "Version already published. Skipping npm publish."

  deploy:
    needs: fullstack-e2e
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install and build app
        run: |
          cd app
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
