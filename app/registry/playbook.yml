---
- name: Déploiement d'un Registry Docker Sécurisé
  hosts: registry_hosts
  become: true
  vars:
    project_dir: "/home/ubuntu/registry-stack"
    # On récupère l'IP publique automatiquement via les facts Ansible
    public_ip: "{{ ansible_host }}"

  tasks:
    - name: Mise à jour du cache API
      apt:
        update_cache: yes

    - name: Installation de Docker et outils
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - openssl
          - apache2-utils # Pour htpasswd
          - python3-passlib
        state: present

    - name: Ajout de l'utilisateur ubuntu au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Création des dossiers
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/auth"
        - "{{ project_dir }}/data"
        - "{{ project_dir }}/certs"
        - "{{ project_dir }}/nginx"

    - name: Génération certificat SSL auto-signé
      command: >-
        openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout {{ project_dir }}/certs/registry.key
        -out {{ project_dir }}/certs/registry.crt
        -subj "/CN={{ public_ip }}"
      args:
        creates: "{{ project_dir }}/certs/registry.crt"

    - name: Déploiement de la configuration Nginx
      template:
        src: nginx.conf.j2
        dest: "{{ project_dir }}/nginx/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Génération mot de passe (admin/admin123)
      htpasswd:
        path: "{{ project_dir }}/auth/registry.password"
        name: admin
        password: admin123
        owner: ubuntu
        group: ubuntu
        mode: 0640
        crypt_scheme: bcrypt

    - name: Copie du docker-compose.yml
      template:
        src: docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Stop stack
      command: docker compose down --remove-orphans
      args:
        chdir: "{{ project_dir }}"

    - name: Démarrage de la stack
      command: docker compose up -d
      args:
        chdir: "{{ project_dir }}"

    - name: Récupération du statut des conteneurs
      command: docker compose ps
      args:
        chdir: "{{ project_dir }}"
      register: compose_ps_output

    - name: Affichage du statut final dans la console
      debug:
        msg: "{{ compose_ps_output.stdout_lines }}"
